<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ================================================================
   Chemistry / electricity constants  (2H2O -> 2H2 + O2)
   cathode: 2H2O + 2e- -> H2 + 2OH-   anode: 4OH- -> O2 + 2H2O + 4e-
   ================================================================ */
const F = 96485;               // C/mol
const VM = 24500;              // mL/mol at 25 °C, 1 atm
const V_DEC = 1.8;             // practical decomposition voltage (1.23 V + overpotential)
const R_OHM = { naoh: 20, water: 4000 };
const SPEED = 30;              // lab seconds per real second
const DISSOLVE = { H2: 0.25, O2: 0.5 };   // mL that dissolve in the liquid first (O2 dissolves a little more)
const CAP = 30;                // graduated capacity of each side tube (mL)

/* ================================================================
   Renderer, scene, camera
   ================================================================ */
const srgb = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);
const isMobile = matchMedia('(pointer:coarse)').matches || Math.min(innerWidth, innerHeight) < 600;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.background = srgb(0.79, 0.83, 0.86);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.3, 500);
scene.add(camera);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 8; controls.maxDistance = 150; controls.maxPolarAngle = 1.52; controls.minPolarAngle = 0.1;
function frameCamera() {
  const a = innerWidth / innerHeight;
  const dist = a < 1 ? 66 : 62;
  controls.target.set(a < 1 ? 4.5 : 5, a < 1 ? 12.5 : 11.5, 1);
  camera.position.copy(controls.target).addScaledVector(new THREE.Vector3(0.08, 0.13, 0.99).normalize(), dist);
  controls.update();
}
frameCamera();

scene.add(new THREE.HemisphereLight(0xffffff, 0x7b838a, 0.95));
const sun = new THREE.DirectionalLight(0xfff8ee, 2.2);
sun.position.set(26, 70, 36); sun.target.position.set(2, 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 45, bottom: -36, near: 20, far: 160 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04; sun.shadow.radius = 4;
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0xe6efff, 0.55); fillL.position.set(-36, 26, 24); scene.add(fillL);
const fireLight = new THREE.PointLight(0xffa040, 0, 0, 2); scene.add(fireLight);

/* ---------- helpers ---------- */
const V2 = (x, y) => new THREE.Vector2(x, y);
const JP = '"Hiragino Sans","Noto Sans JP","Yu Gothic UI",IPAPGothic,system-ui,sans-serif';
function tex(w, h, draw, o = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (o.srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = ANISO;
  if (o.rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(o.rep[0], o.rep[1]); }
  t.userData.canvas = c;
  return t;
}
function add(geo, mat, o = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (o.p) m.position.set(...o.p);
  if (o.r) m.rotation.set(...o.r);
  if (o.s) m.scale.set(...o.s);
  m.castShadow = !!o.cast; m.receiveShadow = !!o.recv;
  if (o.ro !== undefined) m.renderOrder = o.ro;
  (o.to || scene).add(m);
  return m;
}
function glass(o = {}) {
  const m = new THREE.MeshPhysicalMaterial({ color: o.color ?? 0xffffff, roughness: 0.04, metalness: 0, ior: 1.5,
    transparent: true, opacity: o.op ?? 0.12, depthWrite: false, side: THREE.DoubleSide, envMapIntensity: o.env ?? 1.6 });
  const k = (o.edge ?? 0.5).toFixed(2);
  m.onBeforeCompile = (sh) => {
    sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>',
      `{ float e = 1.0 - abs(dot(normalize(normal), normalize(vViewPosition)));
         e = e * e * e; diffuseColor.a = clamp(diffuseColor.a + e * ${k}, 0.0, 0.9); outgoingLight += vec3(e * 0.05); }
       #include <opaque_fragment>`);
  };
  m.customProgramCacheKey = () => 'g' + k;
  return m;
}
function drawLabel(g, w, h, text, sub, band) {
  g.clearRect(0, 0, w, h);
  g.fillStyle = '#fbfaf6'; g.fillRect(0, 0, w, h);
  g.fillStyle = band; g.fillRect(0, 0, w, 14);
  g.fillStyle = '#111a21'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `800 ${Math.min(44, Math.floor(w * 1.1 / Math.max(3, text.length)))}px ${JP}`; g.fillText(text, w / 2, 60);
  g.font = `500 19px ${JP}`; g.fillStyle = '#4b5e6b'; g.fillText(sub, w / 2, 104);
}
const label = (text, sub, w = 256, h = 128, band = '#3d5566') => tex(w, h, (g) => drawLabel(g, w, h, text, sub, band));
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* ================================================================
   Room
   ================================================================ */
const benchMap = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#3b4044'; g.fillRect(0, 0, w, h);
  const im = g.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 16; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(im, 0, 0);
}, { rep: [5, 2.5] });
add(new THREE.BoxGeometry(140, 4, 60), new THREE.MeshStandardMaterial({ map: benchMap, roughness: 0.94, envMapIntensity: 0.45 }), { p: [4, -2, -4], recv: true });
const wallMap = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#c1c9cf'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    const v = 230 + ((i * 7 + j * 3) % 9); g.fillStyle = `rgb(${v - 3},${v + 1},${v + 4})`;
    g.fillRect(i * 128 + 3, j * 128 + 3, 122, 122);
  }
}, { rep: [12, 6] });
add(new THREE.PlaneGeometry(140, 70), new THREE.MeshStandardMaterial({ map: wallMap, roughness: 0.55, envMapIntensity: 0.6 }), { p: [4, 35, -34], recv: true });

/* ================================================================
   Hofmann apparatus
   side tubes at x = ±TX, reservoir at x = 0, bottom connector at y = Y_BOT
   ================================================================ */
const chrome = new THREE.MeshStandardMaterial({ color: 0xd2d6da, metalness: 1, roughness: 0.22 });
const castIron = new THREE.MeshStandardMaterial({ color: 0x2d3338, metalness: 0.4, roughness: 0.55 });
const TX = 5, TR = 0.95, Y_BOT = 4.5, Y_TOP = 23.5, ML = 0.5;   // ML: height per mL
const Y_ZERO = Y_TOP, Y_FULL = Y_TOP - CAP * ML;
const glassMat = glass({ op: 0.13, edge: 0.6 });
// stand
add(new RoundedBoxGeometry(22, 0.9, 7, 2, 0.3), castIron, { p: [0, 0.45, -3.2], cast: true, recv: true });
add(new THREE.CylinderGeometry(0.38, 0.38, 30, 16), chrome, { p: [0, 15, -4.6], cast: true });
// dark backdrop so the clear liquid, bubbles and scale read clearly
add(new RoundedBoxGeometry(24, 31, 0.6, 2, 0.25), new THREE.MeshStandardMaterial({ color: 0x0d1013, roughness: 1, envMapIntensity: 0.12 }), { p: [0, 15.6, -7.2], cast: true, recv: true });
for (const x of [-9, 9]) add(new THREE.BoxGeometry(1.2, 1.2, 7), castIron, { p: [x, 0.6, -6.4], cast: true, recv: true });
for (const y of [9.5, 20]) {
  add(new RoundedBoxGeometry(1.5, 1.5, 1.5, 2, 0.25), castIron, { p: [0, y, -4.6], cast: true });
  add(new THREE.CylinderGeometry(0.18, 0.18, TX * 2 + 1.6, 10), chrome, { p: [0, y, -2.2], r: [0, 0, Math.PI / 2], cast: true });
  add(new THREE.CylinderGeometry(0.18, 0.18, 2.2, 10), chrome, { p: [0, y, -3.4], r: [Math.PI / 2, 0, 0] });
  for (const sx of [-1, 1]) add(new THREE.TorusGeometry(TR + 0.12, 0.13, 8, 28), chrome, { p: [sx * TX, y, 0], r: [Math.PI / 2, 0, 0], cast: true });
  for (const sx of [-1, 1]) add(new THREE.CylinderGeometry(0.14, 0.14, 1.2, 8), chrome, { p: [sx * TX, y, -1.4], r: [Math.PI / 2, 0, 0] });
}
// side tubes
const tubes = [-1, 1].map((sx) => {
  const g = new THREE.Group(); g.position.x = sx * TX; scene.add(g);
  add(new THREE.CylinderGeometry(TR, TR, Y_TOP - Y_BOT + 2.4, 36, 1, true), glassMat, { p: [0, (Y_TOP + Y_BOT - 2.4) / 2, 0], to: g, ro: 6 });
  // tapered top and stopcock
  add(new THREE.CylinderGeometry(0.28, TR, 1.4, 36, 1, true), glassMat, { p: [0, Y_TOP + 0.7, 0], to: g, ro: 6 });
  add(new THREE.CylinderGeometry(0.28, 0.28, 2.6, 16, 1, true), glassMat, { p: [0, Y_TOP + 2.7, 0], to: g, ro: 6 });
  add(new THREE.SphereGeometry(0.62, 20, 14), glass({ op: 0.22, edge: 0.7 }), { p: [0, Y_TOP + 2.2, 0], to: g, ro: 6 });
  const cock = new THREE.Group(); cock.position.set(0, Y_TOP + 2.2, 0); g.add(cock);
  add(new THREE.CylinderGeometry(0.26, 0.26, 2.0, 12), glass({ op: 0.3, edge: 0.8 }), { r: [Math.PI / 2, 0, 0], to: cock, ro: 7 });
  add(new RoundedBoxGeometry(0.35, 1.6, 0.35, 2, 0.1), glass({ op: 0.35, edge: 0.9 }), { p: [0, 0, 1.05], to: cock, ro: 7 });
  // rubber stopper + electrode at the bottom

function fresh() {

function sim(dt) {
  S.t += dt;
  const I = S.on ? Math.max(0, (S.V - V_DEC) / R_OHM[S.elec]) : 0;
  S.I = I;
  const lab = dt * SPEED;
  if (S.on) S.simT += lab;
  const ne = I * lab / F;                                    // mol electrons this step
  const prod = [0, 0]; prod[cathode()] = ne / 2 * VM; prod[1 - cathode()] = ne / 4 * VM;   // mL
  tubes.forEach((tb, i) => {
    const kind = i === cathode() ? 'H2' : 'O2';
    let p = prod[i];
    const dis = Math.min(Math.max(0, DISSOLVE[kind] - tb.dissolved), p * 0.6);
    tb.dissolved += dis; p -= dis;
    tb.rate = prod[i] / Math.max(dt, 1e-6);                   // mL per real second (for bubbles)
    if (p > 0) {
      if (S.cock) { tb.escaped = (tb.escaped || 0) + p; }
      else { tb.gas = Math.min(CAP + 0.5, tb.gas + p); tb.kind = kind; }
    }
    if (tb.release > 0) { const r = Math.min(tb.gas, tb.gas * (1 - Math.exp(-dt * 3.5)) + dt * 0.4); tb.gas -= r; tb.release -= dt; if (tb.gas < 0.02) tb.gas = 0; }
  });

  if (S.on && !S.flags.lowV && S.elec === 'naoh' && S.V <= V_DEC && S.t - S.onAt > 1.0) { S.flags.lowV = true; logPush(`電圧が低すぎて、電気分解が起こらない（約${V_DEC} V 以下）`, '', '#9fb3c0'); }
  if (S.on && S.cock && !S.flags.escape && (tubes[0].escaped || 0) > 0.6) { S.flags.escape = true; logPush('活栓が開いていて、気体がたまらずに逃げていく', '失敗', '#e8a87c'); toast('活栓が開いたまま — 気体が外に逃げてたまらない', true); }
  if (!S.flags.bub && S.I > 0.05) { S.flags.bub = true; logPush('両方の電極から気体の泡が出てきた', '', '#dff0ff'); }
  if (!S.flags.ratio && tubes[cathode()].gas > 10) { S.flags.ratio = true; logPush(`陰極側の気体が陽極側のおよそ2倍たまる（${ratioText()}）。ぴったり2にならないのは、酸素のほうが水に少し多く溶けるため`, '2:1', '#cfe6f2', 'ok'); }
  if (S.on && tubes[cathode()].gas >= CAP) { setPower(false); toast('目盛りいっぱいになったので電源を切った'); }

    const lv = Y_ZERO - tb.gas * ML;
    levelSum += tb.gas;
    tb.liq.scale.y = lv - Y_BOT; tb.liq.position.y = (lv + Y_BOT) / 2;
    tb.liqTop.position.y = lv;

  });
  setBulb(BULB_Y - 1.4 + levelSum * 0.055);
  // bubbles rise from each electrode plate to the liquid surface
  let used = 0;
  tubes.forEach((tb, i) => {
    tb.bAcc += Math.min(40, tb.rate * (i === cathode() ? 1.6 : 2.2)) * dt;
  });
  for (const b of bub) {

      if (i >= 0) {
        tubes[i].bAcc -= 1;
        const h2 = i === cathode();
        b.on = true; b.i = i; b.x = (Math.random() - 0.5) * 0.7; b.z = (Math.random() - 0.5) * 0.5; b.y = Y_BOT + 1.4 + Math.random() * 2;
        b.v = 4 + Math.random() * 3; b.r = h2 ? 0.06 + Math.random() * 0.06 : 0.08 + Math.random() * 0.08; b.ph = Math.random() * 6;
      }

  tubes.forEach((tb, i) => {
    const side = i === 0 ? 'L' : 'R', cath = i === c;
    $('k' + side).textContent = `${i === 0 ? '左' : '右'}の管 · ${cath ? '陰極（−）' : '陽極（＋）'}`;
    $('v' + side).innerHTML = `${tb.gas.toFixed(1)}<small>mL</small>`;
    $('n' + side).textContent = tb.tested === 'H2' ? '水素だった' : tb.tested === 'O2' ? '酸素だった' : 'まだ調べていない';
  });
  $('ratio').innerHTML = `陰極：陽極 ＝ <b>${ratioText()}</b>`;
  $('eq').classList.toggle('lit', S.I > 0.05);
  $('rV').innerHTML = `${S.V.toFixed(1)}<small>V</small>`;
  $('rI').innerHTML = `${S.I.toFixed(S.I > 0 && S.I < 0.01 ? 3 : 2)}<small>A</small>`;
  const m = Math.floor(S.simT / 60), s = Math.floor(S.simT % 60);
  $('rT').textContent = `${m}:${String(s).padStart(2, '0')}`;
  const key = `${S.V}|${S.I.toFixed(3)}|${S.on}`;
  if (key !== dispKey) { dispKey = key; drawDisplay(S.on ? S.V : 0, S.I, S.on); }
}
const logEl = $('log'); const LOGMAX = 7;
function logPush(text, tag = '', color = '#fff', cls = '') {
  const e = logEl.querySelector('.empty'); if (e) e.remove();
  const li = document.createElement('li'); if (cls) li.className = cls;
  li.innerHTML = `<i style="background:${color}"></i><span>${text}</span>${tag ? `<em>${tag}</em>` : ''}`;
  logEl.prepend(li); while (logEl.children.length > LOGMAX) logEl.lastChild.remove();
}
let tt; function toast(s, warn = false, cls = '') { const e = $('toast'); e.textContent = s; e.className = warn ? 'warn' : cls; e.style.opacity = 1; clearTimeout(tt); tt = setTimeout(() => e.style.opacity = 0, warn ? 3000 : 1800); }

/* ================================================================
   Controls
   ================================================================ */
function updateButtons() {
  $('bPow').textContent = S.on ? '電源を切る' : '電源を入れる'; $('bPow').classList.toggle('lit', S.on);
  $('bCock').textContent = S.cock ? '上の活栓：開' : '上の活栓：閉'; $('bCock').classList.toggle('warn', S.cock);
  document.querySelectorAll('#elec button').forEach(b => b.classList.toggle('on', b.dataset.e === S.elec));
  document.querySelectorAll('#tool button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tool));
  $('volt').value = S.V; $('vv').textContent = `${S.V.toFixed(1)} V`;
}
function setPower(on) {
  if (on === S.on) return;
  if (on && S.test) return;
  S.on = on; S.onAt = S.t;
  if (on) S.snap = null;
  if (on) logPush(`電源を入れた（${S.V.toFixed(1)} V・${S.elec === 'naoh' ? '水酸化ナトリウム水溶液' : '純粋な水'}${S.rev ? '・逆につないだ' : ''}）`, '', '#7dff9a');
  else logPush('電源を切った', '', '#8899aa');
  updateButtons();
}
function setCock(open) {
  if (S.test) return;
  S.cock = open;
  if (open && totalGas() > 0.1) { tubes.forEach(t => { t.release = 1.6; }); logPush('活栓を開けたので、たまっていた気体が出ていった', '', '#c8d0d6'); }
  if (open) toast('上の活栓を開けた — このままだと気体がたまらない');
  updateButtons();
}
function setRev(rev) {
  if (S.on) { toast('電源を切ってから、つなぎ方を変えよう'); return; }
  if (totalGas() > 0.1) { toast('管に気体が残っています —「やり直す」で空にしてから'); return; }
  S.rev = rev; tubes.forEach(t => { t.dissolved = 0; });
  rebuildWires(S.rev); drawElLabels(S.rev);
  logPush(rev ? 'つなぎ方を逆にした：左が陽極（＋）、右が陰極（−）。水素はいつも陰極（−）側にたまる' : 'つなぎ方を元に戻した：左が陰極（−）、右が陽極（＋）', '', '#c0392b');
  $('bRev').textContent = rev ? 'つなぎ方を元に戻す' : 'つなぎ方を逆にする';
  hudDirty = true;
}
function setElec(e) { if (e in R_OHM) { S.elec = e; S.flags.noCurrent = false; if (S.on) S.onAt = S.t; logPush(e === 'naoh' ? '液体：水酸化ナトリウム水溶液（イオンが増えて電流が流れやすくなる）' : '液体：純粋な水', '', '#cfe6f2'); updateButtons(); } }
function setVolt(v) { S.V = Math.max(0, Math.min(12, +v)); S.flags.lowV = false; if (S.on) S.onAt = S.t; updateButtons(); hudDirty = true; }
function setTool(t) { if (t === 'match' || t === 'incense') { S.tool = t; updateButtons(); } }
function reset() {
  const keepV = S.V;
  S = fresh(); S.V = keepV;
  tubes.forEach(t => { t.gas = 0; t.kind = null; t.tested = null; t.dissolved = 0; t.release = 0; t.escaped = 0; t.bAcc = 0; t.rate = 0; t.cock.rotation.z = 0; });
  bub.forEach(b => b.on = false);
  fireMat.opacity = 0; flashMat.opacity = 0; fireLight.intensity = 0; ember.material.emissiveIntensity = 0;
  placeTools(); rebuildWires(false); drawElLabels(false); $('bRev').textContent = 'つなぎ方を逆にする';
  logEl.innerHTML = '<li class="empty">電源を入れて電流を流してみよう</li>';
  updateButtons(); hudDirty = true;
}
$('bPow').addEventListener('click', () => setPower(!S.on));
$('bCock').addEventListener('click', () => setCock(!S.cock));
$('bRev').addEventListener('click', () => setRev(!S.rev));
$('bReset').addEventListener('click', reset);
$('volt').addEventListener('input', (e) => setVolt(e.target.value));
document.querySelectorAll('#elec button').forEach(b => b.addEventListener('click', () => setElec(b.dataset.e)));
document.querySelectorAll('#tool button').forEach(b => b.addEventListener('click', () => setTool(b.dataset.t)));
$('bTestL').addEventListener('click', () => startTest(0));
$('bTestR').addEventListener('click', () => startTest(1));

function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false); hudDirty = true;
}
addEventListener('resize', onResize);

/* ================================================================
   Loop
   ================================================================ */
reset(); onResize();
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  if (!S.paused) { sim(dt); visuals(dt); }
  controls.update();
  hudT += dt;
  if (hudDirty && hudT > 1 / 15) { hudT = 0; hudDirty = false; updateHud(); }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);

// hook for automated checks; has no effect on normal use
window.__elec = {
  get S() { return S; }, tubes, F, VM, V_DEC, R_OHM, SPEED, cathode, ratioText,
  setPower, setCock, setRev, setElec, setVolt, setTool, startTest, reset,
  click(id) { document.getElementById(id).click(); },
  step(sec, h = 1 / 60) { for (let t = 0; t < sec; t += h) { sim(h); visuals(h); } updateHud(); renderer.render(scene, camera); },
  hold(on) { renderer.setAnimationLoop(on ? null : frame); if (on) { controls.update(); updateHud(); renderer.render(scene, camera); } },
  view(t, p) { controls.target.set(...t); camera.position.set(...p); controls.update(); }
};
</script>
</body>
